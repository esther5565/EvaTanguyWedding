<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moments – Eva &amp; Tanguy</title>
<link rel="preload" href="fonts/cormorant-300.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-300-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/jost-300.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/jost-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="moments" data-guard>
<header class="top" id="top"></header>
<main class="page wide">
  <h2 data-i18n="nav.moments">Moments</h2>
  <div class="divider"></div>

  <div class="moments-bar">
    <button class="dl-all" id="moments-dl" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>
      <span data-i18n="moments.downloadAll">Download all</span>
    </button>
  </div>

  <p class="note" id="moments-note" hidden data-i18n="moments.test">Test mode: photos are only shown on this screen and are not saved.</p>
  <p class="note" id="moments-empty" hidden data-i18n="moments.empty">No photos yet. Be the first to share a moment!</p>
  <p class="note err" id="moments-loaderr" hidden data-i18n="moments.loaderror">We couldn’t load the photos. Please try again later.</p>

  <div class="moments"><div class="grid" id="moments-grid"></div></div>
</main>

<!-- These sit outside <main> on purpose (they are fixed to the screen) -->
<button class="fab" id="moments-add" type="button" aria-label="Add photos" data-i18n-aria="moments.add"></button>
<input type="file" id="moments-file" accept="image/*" multiple hidden>
<div class="toast" id="moments-status" role="status" hidden></div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" hidden>
  <button class="lb-btn lb-close" id="lb-close" type="button" aria-label="Close" data-i18n-aria="moments.close">&times;</button>
  <button class="lb-btn lb-share" id="lb-share" type="button" aria-label="Download photo">
    <svg id="ic-share" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M12 15V4m0 0L8 8m4-4 4 4M6 12v7h12v-7"/></svg>
    <svg id="ic-dl" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>
  </button>
  <button class="lb-btn lb-prev" id="lb-prev" type="button" aria-label="Previous photo" data-i18n-aria="moments.prev">&lsaquo;</button>
  <img id="lb-img" alt="">
  <button class="lb-btn lb-next" id="lb-next" type="button" aria-label="Next photo" data-i18n-aria="moments.next">&rsaquo;</button>
  <p class="lb-cap" id="lb-cap"></p>
</div>

<script src="js/guests.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
